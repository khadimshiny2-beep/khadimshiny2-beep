name: Wired Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/wired_stats.py"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate github-metrics.svg
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/wired_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "wired-bot"
          git config user.email "wired-bot@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || git commit -m "chore: refresh wired metrics"
          git push
