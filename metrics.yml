name: Wired Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: khadimshiny2-beep
          filename: github-metrics.svg
          committer_message: "chore: refresh wired metrics [skip ci]"

          template: classic
          base: header, activity, community, repositories, metrics
          base_indepth: yes
          config_timezone: Africa/Dakar
          config_display: large

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%

          plugin_lines: yes
          plugin_lines_skipped: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # match the README palette (dark violet + lavender)
          extras_css: |
            :root, :root[data-color-mode],
            .metrics, svg {
              --color-canvas-default: #12101c;
              --color-canvas-subtle: #181526;
              --color-fg-default: #e8e6f7;
              --color-fg-muted: #7c6fae;
              --color-border-default: #2a2440;
              --color-border-muted: #2a2440;
              --color-accent-fg: #b9a6ff;
              --color-accent-emphasis: #a08cff;
            }
            h1, h2, h3 { color: #b9a6ff !important; }
